<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Ruler · Free design brief generator for designers</title>
    <meta name="description" content="Generate realistic design briefs in seconds, build your portfolio from the work, and share it with a community of designers. Free to use." />
    <link rel="canonical" href="https://openruler.design/" />
    <meta name="theme-color" content="#F8F7F4" />

    <!-- Link previews (iMessage, Instagram DMs, LinkedIn, X, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open Ruler" />
    <meta property="og:url" content="https://openruler.design/" />
    <meta property="og:title" content="Open Ruler · Every great project starts with a good brief" />
    <meta property="og:description" content="Free design brief generator, portfolio and community for designers." />
    <meta property="og:image" content="https://openruler.design/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Open Ruler: Every great project starts with a good brief." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Open Ruler · Every great project starts with a good brief" />
    <meta name="twitter:description" content="Free design brief generator, portfolio and community for designers." />
    <meta name="twitter:image" content="https://openruler.design/og-image.png" />

    <!-- Tells Google what the site is (can show the name + search box). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Open Ruler",
          "url": "https://openruler.design/",
          "description": "Free design brief generator, portfolio and community for designers."
        },
        {
          "@type": "WebApplication",
          "name": "Open Ruler",
          "url": "https://openruler.design/",
          "applicationCategory": "DesignApplication",
          "operatingSystem": "Web",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "description": "Generate realistic, client-style design briefs for practice, build a portfolio from the work and share it with other designers."
        }
      ]
    }
    </script>
    <!-- Opens the connection to Supabase (data + image storage) early,
         in parallel with the page loading. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho:wght@400;700&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@200;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
