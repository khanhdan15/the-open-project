<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 192 192">
  <!-- Open Ruler mark (ring + short line + R), rebuilt from
       src/assets/logobnw_main.png with the R pulled in close so it fits a
       square icon. Inverts to light in dark-mode browsers. -->
  <style>@media (prefers-color-scheme: dark) { image { filter: invert(1); } }</style>
  <image width="192" height="192" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
</svg>
