[build]
  command = "npm run build"
  publish = "dist"

# Bots probing for WordPress / PHP / secret files: answer with a real
# "not found" instead of the app, so they don't count as pageviews and
# search engines never see them as pages.
[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/wp-content/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/wp-json/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/wordpress/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

# Old www / Netlify addresses → the one real domain (better for SEO).
[[redirects]]
  from = "https://www.openruler.design/*"
  to = "https://openruler.design/:splat"
  status = 301
  force = true

# Everything else is the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built JS/CSS have hashed names, so browsers can keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
